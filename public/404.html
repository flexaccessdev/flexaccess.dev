<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — flexaccess.dev</title>
    <link rel="icon" type="image/svg+xml" href="/flexaccess.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbfaf8; --ink: #1f2733; --ink-soft: #5a6472;
        --line-strong: #d9d4cb; --accent: #0f766e; --accent-ink: #0a5c55; --accent-tint: #eef5f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #15181d; --ink: #e6e9ee; --ink-soft: #a3acb8;
          --line-strong: #363d48; --accent: #2dd4bf; --accent-ink: #5eead4; --accent-tint: rgba(45,212,191,.1);
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main { max-width: 26rem; text-align: center; }
      .code {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        color: var(--accent-ink);
        letter-spacing: 0.08em;
      }
      h1 { font-size: 1.6rem; font-weight: 600; margin: 0.75rem 0; }
      p { color: var(--ink-soft); line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--accent-ink);
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 0.6rem 1.1rem;
      }
      a:hover { background: var(--accent-tint); border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404 · route not found</div>
      <h1>This page doesn't exist</h1>
      <p>The address may have changed, or the link you followed is out of date.</p>
      <a href="/">Back to flexaccess.dev</a>
    </main>
  </body>
</html>
